<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TELKU V1.8.2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
}
header{
  background:linear-gradient(135deg,#0b5cff,#00a8ff);
  color:white;
  padding:22px 18px;
}
.logo{
  font-size:30px;
  font-weight:800;
}
.tag{
  opacity:.9;
  margin-top:4px;
}
.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}
h2{
  margin-top:0;
}
label{
  display:block;
  font-weight:700;
  margin:14px 0 6px;
}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #d7deea;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:16px;
  background:#0b5cff;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
button:hover{
  opacity:.92;
}
button.secondary{
  background:#172033;
}
.plan{
  border:1px solid #dce4f0;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
  cursor:pointer;
}
.plan:hover{
  border-color:#0b5cff;
}
.plan.selected{
  border:2px solid #0b5cff;
  background:#eef5ff;
}
.plan-title{
  font-weight:800;
  font-size:18px;
}
.price{
  color:#0b5cff;
  font-size:20px;
  font-weight:800;
  margin-top:6px;
}
.small{
  color:#687386;
  font-size:13px;
}
.status{
  padding:12px;
  border-radius:10px;
  background:#eef3f8;
  margin-top:15px;
  white-space:pre-wrap;
  word-break:break-word;
}
.success{
  background:#e9f9ef;
  color:#16733c;
}
.error{
  background:#fff0f0;
  color:#b42318;
}
.hidden{
  display:none;
}
.order-box{
  background:#f8fafc;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <div class="logo">TELKU</div>
  <div class="tag">Global Connectivity • eSIM • Travel</div>
</header>

<div class="container">

  <!-- CUSTOMER -->
  <div class="card">
    <h2>👤 Customer Information</h2>

    <label>Full Name</label>
    <input id="fullName" type="text" placeholder="Your full name">

    <label>Email</label>
    <input id="email" type="email" placeholder="you@email.com">

    <label>Phone</label>
    <input id="phone" type="text" placeholder="+62xxxxxxxxxx">

    <button onclick="loadCountries()">
      Continue
    </button>
  </div>

  <!-- COUNTRY -->
  <div id="countrySection" class="card hidden">
    <h2>🌎 Choose Country</h2>

    <select id="countrySelect" onchange="loadPlans()">
      <option value="">Select country</option>
    </select>

    <div id="countryStatus" class="status"></div>
  </div>

  <!-- PLANS -->
  <div id="planSection" class="card hidden">
    <h2>📶 eSIM Plans</h2>

    <div id="plans"></div>

    <button onclick="createOrder()">
      Continue to Order
    </button>

    <div id="planStatus" class="status"></div>
  </div>

  <!-- ORDER -->
  <div id="orderSection" class="card hidden">
    <h2>🧾 Order Created</h2>

    <div class="order-box">
      <div><b>Order Code</b></div>
      <div id="orderCode"></div>

      <br>

      <div><b>Customer</b></div>
      <div id="orderCustomer"></div>

      <br>

      <div><b>Country</b></div>
      <div id="orderCountry"></div>

      <br>

      <div><b>Plan</b></div>
      <div id="orderPlan"></div>

      <br>

      <div><b>Total</b></div>
      <div id="orderTotal"></div>

      <br>

      <div><b>Status</b></div>
      <div>Pending</div>
    </div>

    <button class="secondary" onclick="location.reload()">
      New Order
    </button>
  </div>

</div>

<script>

/* =====================================================
   TELKU SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://xozjhayxttryegynntld.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oe2mqFxqjRqkx7IxO2dk8w_3UGaVsRr";


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentCustomer = null;
let selectedPlan = null;


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  endpoint,
  options = {}
){

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + endpoint,
    {
      ...options,

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":options.method === "POST"
          ? "return=representation"
          : "return=minimal",

        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status +
      " - " +
      (
        data?.message ||
        data?.error_description ||
        data?.hint ||
        text ||
        "Supabase error"
      )
    );
  }

  return data;
}


/* =====================================================
   HELPERS
===================================================== */

function makeCode(prefix){

  const now = new Date();

  const stamp =
    now.getFullYear().toString() +
    String(now.getMonth()+1).padStart(2,"0") +
    String(now.getDate()).padStart(2,"0") +
    String(now.getHours()).padStart(2,"0") +
    String(now.getMinutes()).padStart(2,"0") +
    String(now.getSeconds()).padStart(2,"0");

  const random =
    Math.random()
      .toString(36)
      .substring(2,7)
      .toUpperCase();

  return prefix + "-" + stamp + "-" + random;
}


function rupiah(value){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(Number(value || 0));

}


/* =====================================================
   CREATE CUSTOMER
===================================================== */

async function createCustomer(){

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();


  if(!fullName || !email || !phone){

    throw new Error(
      "Please complete Full Name, Email and Phone."
    );
  }


  const customerCode =
    makeCode("CUS");


  const result =
    await supabaseRequest(
      "telku_customer",
      {
        method:"POST",

        body:JSON.stringify({
          customer_code:customerCode,
          full_name:fullName,
          email:email,
          phone:phone
        })
      }
    );


  if(!result || !result[0]){

    throw new Error(
      "Customer was not returned by Supabase."
    );
  }


  currentCustomer = result[0];

  return currentCustomer;
}


/* =====================================================
   LOAD COUNTRIES
===================================================== */

async function loadCountries(){

  const status =
    document.getElementById("countryStatus");

  status.className = "status";

  status.textContent =
    "Connecting to TELKU...";


  try{

    await createCustomer();


    const plans =
      await supabaseRequest(
        "telku_plans?select=id,plan_code,country,flag,data_gb,validity_days,price&order=country.asc,price.asc"
      );


    if(!plans || plans.length === 0){

      throw new Error(
        "No plans found in telku_plans."
      );
    }


    const countrySelect =
      document.getElementById("countrySelect");

    countrySelect.innerHTML =
      '<option value="">Select country</option>';


    const countries = {};


    plans.forEach(plan => {

      if(!countries[plan.country]){

        countries[plan.country] = {
          country:plan.country,
          flag:plan.flag || ""
        };

      }

    });


    Object.values(countries)
      .forEach(country => {

        const option =
          document.createElement("option");

        option.value =
          country.country;

        option.textContent =
          (country.flag ? country.flag + " " : "") +
          country.country;

        countrySelect.appendChild(option);

      });


    document
      .getElementById("countrySection")
      .classList.remove("hidden");


    status.className =
      "status success";

    status.textContent =
      "Connected successfully.\n" +
      "Customer created: " +
      currentCustomer.customer_code;


  }catch(error){

    status.className =
      "status error";

    status.textContent =
      "ERROR:\n" + error.message;

    console.error(error);
  }

}


/* =====================================================
   LOAD PLANS
===================================================== */

async function loadPlans(){

  const country =
    document.getElementById("countrySelect").value;

  const plansContainer =
    document.getElementById("plans");

  const status =
    document.getElementById("planStatus");


  plansContainer.innerHTML = "";

  selectedPlan = null;


  if(!country){

    document
      .getElementById("planSection")
      .classList.add("hidden");

    return;
  }


  status.className =
    "status";

  status.textContent =
    "Loading plans...";


  try{

    const endpoint =
      "telku_plans" +
      "?country=eq." +
      encodeURIComponent(country) +
      "&select=id,plan_code,country,flag,data_gb,validity_days,price" +
      "&order=price.asc";


    const plans =
      await supabaseRequest(endpoint);


    if(!plans || plans.length === 0){

      throw new Error(
        "No eSIM plans available for " +
        country
      );
    }


    plans.forEach(plan => {

      const div =
        document.createElement("div");

      div.className =
        "plan";


      div.innerHTML = `

        <div class="plan-title">
          ${plan.flag || ""} ${plan.plan_code}
        </div>

        <div class="small">
          ${plan.data_gb} GB •
          ${plan.validity_days} Days
        </div>

        <div class="price">
          ${rupiah(plan.price)}
        </div>

      `;


      div.onclick = function(){

        document
          .querySelectorAll(".plan")
          .forEach(x =>
            x.classList.remove("selected")
          );

        div.classList.add("selected");

        selectedPlan = plan;

        status.className =
          "status success";

        status.textContent =
          "Selected: " +
          plan.plan_code;

      };


      plansContainer.appendChild(div);

    });


    document
      .getElementById("planSection")
      .classList.remove("hidden");


    status.textContent =
      plans.length +
      " plan(s) available.";


  }catch(error){

    status.className =
      "status error";

    status.textContent =
      "ERROR:\n" + error.message;

    console.error(error);
  }

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createOrder(){

  const status =
    document.getElementById("planStatus");


  if(!currentCustomer){

    status.className =
      "status error";

    status.textContent =
      "Customer session is missing.";

    return;
  }


  if(!selectedPlan){

    status.className =
      "status error";

    status.textContent =
      "Please select an eSIM plan first.";

    return;
  }


  status.className =
    "status";

  status.textContent =
    "Creating order...";


  try{

    const orderCode =
      makeCode("ORD");


    const orderPayload = {

      order_code:orderCode,

      customer_id:
        currentCustomer.id,

      plan_id:
        selectedPlan.id,

      status:"pending",

      total:
        Number(selectedPlan.price),

      currency:"IDR"

    };


    console.log(
      "ORDER PAYLOAD:",
      orderPayload
    );


    const result =
      await supabaseRequest(
        "telku_orders",
        {
          method:"POST",
          body:JSON.stringify(orderPayload)
        }
      );


    if(!result || !result[0]){

      throw new Error(
        "Order was not returned by Supabase."
      );
    }


    const order =
      result[0];


    document.getElementById(
      "orderCode"
    ).textContent =
      order.order_code;


    document.getElementById(
      "orderCustomer"
    ).textContent =
      currentCustomer.full_name;


    document.getElementById(
      "orderCountry"
    ).textContent =
      selectedPlan.country;


    document.getElementById(
      "orderPlan"
    ).textContent =
      selectedPlan.plan_code +
      " — " +
      selectedPlan.data_gb +
      " GB / " +
      selectedPlan.validity_days +
      " Days";


    document.getElementById(
      "orderTotal"
    ).textContent =
      rupiah(order.total);


    document
      .getElementById("orderSection")
      .classList.remove("hidden");


    document
      .getElementById("planSection")
      .classList.add("hidden");


  }catch(error){

    status.className =
      "status error";

    status.textContent =
      "STEP 2 ERROR:\n" +
      error.message;

    console.error(error);
  }

}

</script>

</body>
</html>
