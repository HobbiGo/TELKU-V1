<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TELKU V1.8</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-bottom:12px;
}

h3{
  margin-bottom:8px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #d6dce5;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.plan{
  border:1px solid #e1e5eb;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  cursor:pointer;
}

.plan.selected{
  border:2px solid #111827;
  background:#f3f4f6;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-top:6px;
}

.hidden{
  display:none;
}

.status{
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  font-size:14px;
  white-space:pre-wrap;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#e0f2fe;
  color:#075985;
}

.code{
  background:#f3f4f6;
  padding:10px;
  border-radius:8px;
  margin-top:7px;
  font-family:monospace;
  word-break:break-all;
}
</style>
</head>

<body>

<header>
TELKU
</header>

<div class="container">

<!-- HOME -->
<div id="home">

  <div class="card">
    <h2>🌍 Global eSIM</h2>
    <p>Stay connected across countries with TELKU.</p>
  </div>

  <div class="card">
    <h3>Customer</h3>

    <input id="fullName" placeholder="Full Name">
    <input id="email" type="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    <input id="country" placeholder="Country">

  </div>

  <div class="card">
    <h3>Choose Country</h3>

    <select id="countrySelect" onchange="loadPlans()">
      <option value="">Select Country</option>
      <option value="Indonesia">Indonesia</option>
      <option value="Singapore">Singapore</option>
      <option value="Malaysia">Malaysia</option>
      <option value="Thailand">Thailand</option>
      <option value="Japan">Japan</option>
      <option value="South Korea">South Korea</option>
    </select>

  </div>

  <div id="plans"></div>

</div>


<!-- PAYMENT -->
<div id="paymentPage" class="hidden">

  <div class="card">

    <h2>💳 Payment</h2>

    <div id="paymentSummary"></div>

    <h3 style="margin-top:18px;">Payment Method</h3>

    <select id="paymentMethod">
      <option value="online">Online Payment</option>
      <option value="card">Credit / Debit Card</option>
      <option value="bank_transfer">Bank Transfer</option>
    </select>

    <button id="payButton" onclick="processPayment()">
      Pay Now
    </button>

    <div id="paymentStatus"></div>

  </div>

</div>


<!-- SUCCESS -->
<div id="successPage" class="hidden">

  <div class="card">

    <h2>✅ Transaction Success</h2>

    <p>Your TELKU transaction has been created.</p>

    <div id="successData"></div>

  </div>

</div>

</div>


<script>

/* =====================================================
   TELKU SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://xozjhayxttryegynntld.supabase.co";

/*
  Gunakan Publishable Key TELKU yang sudah digunakan
  pada versi sebelumnya.
*/
const SUPABASE_KEY =
"sb_publishable_oe2mqFxqjRqkx7IxO2dk8w_3UGaVsRr";


/* =====================================================
   STATE
===================================================== */

let selectedPlan = null;


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  table,
  method = "GET",
  body = null,
  query = ""
){

  const options = {
    method,
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer " + SUPABASE_KEY,
      "Content-Type":"application/json",
      "Prefer":"return=representation"
    }
  };

  if(body !== null){
    options.body = JSON.stringify(body);
  }

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/" +
    table +
    query,
    options
  );

  const text = await response.text();

  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(e){
    data = text;
  }

  if(!response.ok){

    let message = "";

    if(data && data.message){
      message = data.message;
    }else if(data && data.hint){
      message = data.hint;
    }else if(data && data.details){
      message = data.details;
    }else{
      message = text || "Unknown Supabase error";
    }

    throw new Error(
      "HTTP " +
      response.status +
      " - " +
      message
    );
  }

  return data;
}


/* =====================================================
   GENERATOR
===================================================== */

function randomCode(prefix){

  const now = Date.now().toString().slice(-8);

  const random =
    Math.floor(Math.random()*9000)+1000;

  return prefix + "-" + now + "-" + random;
}


/* =====================================================
   DEMO PLANS
===================================================== */

const demoPlans = [

  {
    id:"1",
    country:"Indonesia",
    name:"Indonesia 5GB",
    data:"5 GB",
    days:7,
    price:50000,
    currency:"IDR"
  },

  {
    id:"2",
    country:"Indonesia",
    name:"Indonesia 10GB",
    data:"10 GB",
    days:15,
    price:85000,
    currency:"IDR"
  },

  {
    id:"3",
    country:"Singapore",
    name:"Singapore 5GB",
    data:"5 GB",
    days:7,
    price:70000,
    currency:"IDR"
  },

  {
    id:"4",
    country:"Malaysia",
    name:"Malaysia 5GB",
    data:"5 GB",
    days:7,
    price:65000,
    currency:"IDR"
  },

  {
    id:"5",
    country:"Thailand",
    name:"Thailand 5GB",
    data:"5 GB",
    days:7,
    price:70000,
    currency:"IDR"
  },

  {
    id:"6",
    country:"Japan",
    name:"Japan 5GB",
    data:"5 GB",
    days:7,
    price:90000,
    currency:"IDR"
  },

  {
    id:"7",
    country:"South Korea",
    name:"Korea 5GB",
    data:"5 GB",
    days:7,
    price:90000,
    currency:"IDR"
  }

];


/* =====================================================
   LOAD PLANS
===================================================== */

async function loadPlans(){

  const country =
    document.getElementById("countrySelect").value;

  const container =
    document.getElementById("plans");

  container.innerHTML = "";

  selectedPlan = null;

  if(!country){
    return;
  }

  let plans = [];

  try{

    plans = await supabaseRequest(
      "telku_plans",
      "GET",
      null,
      "?country=eq." +
      encodeURIComponent(country) +
      "&select=*"
    );

  }catch(error){

    console.log(
      "Using demo plans:",
      error.message
    );

    plans =
      demoPlans.filter(
        p => p.country === country
      );
  }

  if(!plans || plans.length === 0){

    plans =
      demoPlans.filter(
        p => p.country === country
      );
  }

  plans.forEach(plan => {

    const div =
      document.createElement("div");

    div.className = "plan";

    div.innerHTML = `
      <h3>${plan.name || "TELKU Plan"}</h3>
      <p>${plan.data || ""} • ${plan.days || ""} days</p>
      <div class="price">
        ${plan.currency || "IDR"}
        ${Number(plan.price || 0).toLocaleString("id-ID")}
      </div>
    `;

    div.onclick = function(){

      document
        .querySelectorAll(".plan")
        .forEach(x =>
          x.classList.remove("selected")
        );

      div.classList.add("selected");

      selectedPlan = plan;

      showPayment();
    };

    container.appendChild(div);

  });

}


/* =====================================================
   PAYMENT PAGE
===================================================== */

function showPayment(){

  if(!selectedPlan){
    return;
  }

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("paymentPage")
    .classList.remove("hidden");

  document
    .getElementById("paymentSummary")
    .innerHTML = `

      <p><strong>${selectedPlan.name}</strong></p>

      <p>
        ${selectedPlan.data || ""}
        /
        ${selectedPlan.days || ""} days
      </p>

      <div class="price">
        ${selectedPlan.currency || "IDR"}
        ${Number(selectedPlan.price || 0)
          .toLocaleString("id-ID")}
      </div>
  `;

}


/* =====================================================
   CUSTOMER
===================================================== */

async function getOrCreateCustomer(){

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const country =
    document.getElementById("country").value.trim() ||
    document.getElementById("countrySelect").value;

  if(!fullName || !email){

    throw new Error(
      "Nama dan email customer wajib diisi."
    );
  }


  /* FIND CUSTOMER */

  const existing =
    await supabaseRequest(
      "telku_customer",
      "GET",
      null,
      "?email=eq." +
      encodeURIComponent(email) +
      "&select=*"
    );


  if(existing && existing.length > 0){

    return existing[0];

  }


  /* CREATE CUSTOMER */

  const customerCode =
    randomCode("CUS");

  const created =
    await supabaseRequest(
      "telku_customer",
      "POST",
      {
        customer_code:customerCode,
        full_name:fullName,
        email:email,
        phone:phone,
        country:country
      }
    );

  return created[0];

}


/* =====================================================
   CREATE ORDER
===================================================== */

async function createOrder(customer){

  const orderCode =
    randomCode("ORD");

  /*
    IMPORTANT:
    Jangan mengirim field yang tidak diperlukan.
    Supabase akan menggunakan default untuk field lainnya.
  */

  const payload = {

    order_code:orderCode,

    cust_id:customer.id,

    plan_id:String(selectedPlan.id),

    status:"pending",

    total:Number(selectedPlan.price || 0),

    currency:selectedPlan.currency || "IDR"

  };


  const result =
    await supabaseRequest(
      "telku_orders",
      "POST",
      payload
    );


  if(!result || !result.length){

    throw new Error(
      "Order berhasil dikirim tetapi tidak ada data order yang dikembalikan."
    );

  }


  return result[0];

}


/* =====================================================
   CREATE PAYMENT
===================================================== */

async function createPayment(order){

  const paymentCode =
    randomCode("PAY");

  const method =
    document.getElementById("paymentMethod").value;


  const result =
    await supabaseRequest(
      "telku_payments",
      "POST",
      {

        payment_code:paymentCode,

        order_id:order.id,

        method:method,

        status:"paid",

        amount:Number(selectedPlan.price || 0),

        currency:selectedPlan.currency || "IDR"

      }
    );


  if(!result || !result.length){

    throw new Error(
      "Payment tidak menghasilkan data."
    );

  }


  return result[0];

}


/* =====================================================
   CREATE INVOICE
===================================================== */

async function createInvoice(order){

  const invoiceCode =
    randomCode("INV");


  const result =
    await supabaseRequest(
      "telku_invoices",
      "POST",
      {

        invoice_code:invoiceCode,

        order_id:order.id,

        status:"paid",

        issued_at:new Date().toISOString()

      }
    );


  if(!result || !result.length){

    throw new Error(
      "Invoice tidak berhasil dibuat."
    );

  }


  return result[0];

}


/* =====================================================
   CREATE ESIM
===================================================== */

async function createEsim(order){

  const esimCode =
    randomCode("ESIM");


  const result =
    await supabaseRequest(
      "telku_esims",
      "POST",
      {

        esim_code:esimCode,

        order_id:order.id,

        status:"pending"

      }
    );


  if(!result || !result.length){

    throw new Error(
      "eSIM tidak berhasil dibuat."
    );

  }


  return result[0];

}


/* =====================================================
   UPDATE ORDER
===================================================== */

async function markOrderPaid(order){

  await supabaseRequest(
    "telku_orders",
    "PATCH",
    {
      status:"paid"
    },
    "?id=eq." +
    encodeURIComponent(order.id)
  );

}


/* =====================================================
   FULL TRANSACTION
===================================================== */

async function saveTransaction(){

  let customer;
  let order;
  let payment;
  let invoice;
  let esim;


  /* STEP 1 */

  try{

    customer =
      await getOrCreateCustomer();

  }catch(error){

    throw new Error(
      "STEP 1 ERROR: " +
      error.message
    );

  }


  /* STEP 2 */

  try{

    order =
      await createOrder(customer);

  }catch(error){

    throw new Error(
      "STEP 2 ERROR: " +
      error.message
    );

  }


  /* STEP 3 */

  try{

    payment =
      await createPayment(order);

  }catch(error){

    throw new Error(
      "STEP 3 ERROR: " +
      error.message
    );

  }


  /* STEP 4 */

  try{

    invoice =
      await createInvoice(order);

  }catch(error){

    throw new Error(
      "STEP 4 ERROR: " +
      error.message
    );

  }


  /* STEP 5 */

  try{

    esim =
      await createEsim(order);

  }catch(error){

    throw new Error(
      "STEP 5 ERROR: " +
      error.message
    );

  }


  /* FINAL */

  try{

    await markOrderPaid(order);

  }catch(error){

    throw new Error(
      "FINAL ORDER UPDATE ERROR: " +
      error.message
    );

  }


  return {

    customer,
    order,
    payment,
    invoice,
    esim

  };

}


/* =====================================================
   PAY NOW
===================================================== */

async function processPayment(){

  const button =
    document.getElementById("payButton");

  const status =
    document.getElementById("paymentStatus");


  if(!selectedPlan){

    status.innerHTML =
      `<div class="status error">
        Please select a plan first.
      </div>`;

    return;

  }


  button.disabled = true;

  button.innerText =
    "Processing...";


  status.innerHTML =
    `<div class="status info">
      Processing TELKU transaction...
    </div>`;


  try{

    const result =
      await saveTransaction();


    status.innerHTML =
      `<div class="status success">
        Transaction completed successfully.
      </div>`;


    document
      .getElementById("paymentPage")
      .classList.add("hidden");


    document
      .getElementById("successPage")
      .classList.remove("hidden");


    document
      .getElementById("successData")
      .innerHTML = `

        <p>Customer Code</p>
        <div class="code">
          ${result.customer.customer_code || "-"}
        </div>

        <p style="margin-top:12px;">
          Order Code
        </p>

        <div class="code">
          ${result.order.order_code}
        </div>

        <p style="margin-top:12px;">
          Payment Code
        </p>

        <div class="code">
          ${result.payment.payment_code}
        </div>

        <p style="margin-top:12px;">
          Invoice Code
        </p>

        <div class="code">
          ${result.invoice.invoice_code}
        </div>

        <p style="margin-top:12px;">
          eSIM Code
        </p>

        <div class="code">
          ${result.esim.esim_code}
        </div>

      `;


  }catch(error){

    console.error(error);


    status.innerHTML =
      `<div class="status error">
        <strong>Transaction Error</strong>

        <br><br>

        ${error.message}

      </div>`;


    button.disabled = false;

    button.innerText =
      "Pay Now";

  }

}

</script>

</body>
</html>
